[package]
name = "ddl-calendar"
version = "0.1.0"
description = "A calm, local-first deadline calendar for Windows 11"
authors = ["DDL Calendar"]
edition = "2021"

[lib]
name = "ddl_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
